# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: >-
  Comment only on bugs, security issues, data loss and accessibility failures.
  Skip style, naming, refactor and docs nitpicks. Be brief.
reviews:
  profile: quiet
  request_changes_workflow: false
  # The PR description is the author's own summary; CodeRabbit's goes in its comment.
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  in_progress_fortune: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  auto_review:
    enabled: true
    drafts: false
    # Feature branches stack on each other, so review PRs into any branch.
    base_branches:
      - ".*"
  path_filters:
    - "!public/courses.json"
    - "!package-lock.json"
  path_instructions:
    - path: "src/lib/**/*.ts"
      instructions: >-
        Requirement logic must stay pure (no Svelte, no DOM, no Date.now without
        an injected date). Check rule edge cases and that tests cover them.
    - path: "src/**/*.svelte"
      instructions: >-
        Svelte 5 runes only ($state, $derived, $props). Interactive elements
        must be real buttons, inputs or links with labels.
    - path: "src/templates/**/*.json"
      instructions: >-
        Requirement templates are data. Check they match the Template type in
        src/types.ts and that course codes use the "SUBJ 1234" format.
    - path: "scripts/**/*.mjs"
      instructions: >-
        The Class Roster API allows at most 1 request per second. Flag anything
        that could exceed it or retry without backoff.
chat:
  auto_reply: true
